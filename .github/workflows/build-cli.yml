name: Build Rust CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: 'latest'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            artifact: fluxion-linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            artifact: fluxion-linux-arm64
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x64
            artifact: fluxion-darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
            artifact: fluxion-darwin-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
            artifact: fluxion-win-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross for ARM builds
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI
        working-directory: ./cli
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Copy binary
        run: |
          cd cli/target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp fluxion-cli.exe ${{ matrix.artifact }}
          else
            cp fluxion-cli ${{ matrix.artifact }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cli/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: binaries/*/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Create installer directory
        run: |
          mkdir -p dist/installer
          cp scripts/installer.ts dist/installer/index.mjs

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}