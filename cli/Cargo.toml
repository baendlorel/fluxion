[package]
name = "fluxion-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
chrono = "0.4"
ctrlc = "3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
